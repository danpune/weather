<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Day here, night there: family on both sides of the world -->
  <defs>
    <linearGradient id="day" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a95dd"/><stop offset="1" stop-color="#1f6fb6"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2f63"/><stop offset="1" stop-color="#0e1a3a"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#day)"/>
  <path d="M512 0V512H0Z" fill="url(#night)"/>
  <circle cx="176" cy="176" r="80" fill="#ffd24a"/>
  <mask id="bite"><rect width="512" height="512" fill="#fff"/><circle cx="376" cy="318" r="64" fill="#000"/></mask>
  <circle cx="344" cy="344" r="72" fill="#f4f1dc" mask="url(#bite)"/>
  <circle cx="420" cy="236" r="7" fill="#f4f1dc"/>
